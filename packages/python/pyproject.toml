[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "feather-sdk"
dynamic = ["version"]
description = "Call Feather from Python: build and validate Experience IR (feather.ir/0), validate replies, and serve the browser bundle that renders them. No dependencies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = { text = "UNLICENSED" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]

[tool.setuptools.packages.find]
# namespaces: the browser bundle folders (feather_sdk/static, copied in by scripts/build-wheel.mjs) are data, not code.
include = ["feather_sdk*"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "feather_sdk._version.__version__" }

[tool.setuptools.package-data]
feather_sdk = ["_spec.json", "py.typed", "static/*", "static/fonts/*"]
