name: Record visual baselines

# Records apps/storybook/visual/__screenshots__ in CI's Playwright container and commits them to the branch.
# Start it by hand (Actions → Run workflow), or by pushing apps/storybook/visual/RECORD containing the reference
# name; the recording commit deletes that file.
#   reference: feather-1.7.0  renders Feather 1.7.0 as imported from qooe-core (the L0 parity baseline: the
#                             packages must match it pixel for pixel)
#   reference: current        renders the branch itself (after an intentional visual change), replacing every baseline
#   reference: missing        renders the branch itself, adding baselines only for stories that have none and
#                             leaving every existing one untouched (after adding stories)
on:
  workflow_dispatch:
    inputs:
      reference:
        description: What to record the baselines from
        type: choice
        options: [feather-1.7.0, current, missing]
        default: current
  push:
    paths: [apps/storybook/visual/RECORD]

permissions:
  contents: write

env:
  STORYBOOK_DISABLE_TELEMETRY: "1"
  REFERENCE: ${{ inputs.reference }}
  # The commit that imported Feather 1.7.0 unchanged.
  FEATHER_1_7_0: b0045f3

jobs:
  record:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Which reference
        run: |
          if [ -z "$REFERENCE" ]; then
            test -f apps/storybook/visual/RECORD || { echo "No RECORD file: nothing to record."; exit 1; }
            echo "REFERENCE=$(tr -d '[:space:]' < apps/storybook/visual/RECORD)" >> "$GITHUB_ENV"
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the reference Storybook
        run: |
          if [ "$REFERENCE" = "feather-1.7.0" ]; then
            git worktree add /tmp/reference "$FEATHER_1_7_0"
            cd /tmp/reference/feather-web
            npm ci --no-audit --no-fund
            npx storybook build --quiet -o /tmp/reference-static
          elif [ "$REFERENCE" = "current" ] || [ "$REFERENCE" = "missing" ]; then
            pnpm build && pnpm build-storybook
            cp -r apps/storybook/storybook-static /tmp/reference-static
          else
            echo "Unknown reference \"$REFERENCE\" (feather-1.7.0, current or missing)"; exit 1
          fi
      - name: Record
        run: |
          if [ "$REFERENCE" = "missing" ]; then
            pnpm --filter @feather-apps/storybook exec playwright test --update-snapshots=missing
          else
            rm -rf apps/storybook/visual/__screenshots__
            pnpm --filter @feather-apps/storybook exec playwright test --update-snapshots
          fi
        env:
          STORYBOOK_DIR: /tmp/reference-static
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch apps/storybook/visual/RECORD
          git add apps/storybook/visual/__screenshots__
          git commit -m "Record visual baselines from $REFERENCE" || echo "Baselines unchanged."
          git push origin "HEAD:${GITHUB_REF_NAME}"
